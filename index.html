<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماسح VIN الدقيق</title>
  <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #eef1f4;
      color: #1f2933;
      margin: 0;
      padding: 12px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #243b53;
    }
    .scanner-wrap {
      position: relative;
      width: 100%;
      height: 235px;
      background: #102a43;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .aim-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .aim-box {
      width: 92%;
      height: 58px;
      border: 2px solid #38a169;
      border-radius: 6px;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(16, 42, 67, 0.52);
    }
    .aim-label {
      color: #ffffff;
      font-size: 12px;
      margin-top: 8px;
      background: rgba(16, 42, 67, 0.85);
      padding: 4px 10px;
      border-radius: 5px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #486581;
      margin-bottom: 6px;
      padding: 0 2px;
    }
    input[type="text"] {
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid #bcccdc;
      background: #f8fafc;
      color: #102a43;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #ffffff;
    }
    .btn-live { background-color: #2f855a; }
    .btn-live.active { background-color: #c53030; }
    .btn-send { background-color: #2b6cb0; }
    .btn-fallback {
      width: 100%;
      background-color: #486581;
      font-size: 13px;
      padding: 10px;
      display: block;
      border-radius: 8px;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #334e68;
      min-height: 20px;
      word-break: break-word;
    }
    .visually-hidden-file {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>ماسح VIN الدقيق</h2>

    <div class="scanner-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="aim-overlay">
        <div class="aim-box"></div>
        <div class="aim-label">ثبّت الرقم (17 خانة) داخل المستطيل الأخضر</div>
      </div>
    </div>

    <div class="meta-row">
      <span id="charCount">الخانات: 0 / 17</span>
      <span id="confirmBadge">حالة القراءة: جاري البحث</span>
    </div>

    <input type="text" id="vinInput" placeholder="رقم الهيكل (17 خانة)" maxlength="17">
    <input type="text" id="refInput" placeholder="الرقم المرجعي (اختياري)">

    <div class="btn-row">
      <button type="button" class="btn btn-live" id="liveBtn" onclick="toggleLiveScan()">إيقاف المسح التلقائي</button>
      <button type="button" class="btn btn-send" id="sendBtn" onclick="sendToSheet()">إرسال للشيت</button>
    </div>

    <label for="cameraInput" class="btn-fallback">التقاط صورة عالية الدقة (بديل)</label>
    <input type="file" id="cameraInput" class="visually-hidden-file" accept="image/*" capture="environment">

    <div id="status">جاري تشغيل الكاميرا...</div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzWHfARbW5XAfA82jDQgc_QK_F6ZhN1rtYuh0AVP46rKXA6cGtVT5on7YCP9Of6YMBftw/exec';
    const video = document.getElementById('video');
    const vinInput = document.getElementById('vinInput');
    const refInput = document.getElementById('refInput');
    const statusEl = document.getElementById('status');
    const liveBtn = document.getElementById('liveBtn');
    const sendBtn = document.getElementById('sendBtn');
    const cameraInput = document.getElementById('cameraInput');
    const charCount = document.getElementById('charCount');
    const confirmBadge = document.getElementById('confirmBadge');

    let worker = null;
    let isScanning = true;
    let isBusy = false;
    let scanTimer = null;

    vinInput.addEventListener('input', function () {
      this.value = this.value.replace(/[^A-HJ-NPR-Z0-9]/gi, '').toUpperCase().slice(0, 17);
      charCount.textContent = 'الخانات: ' + this.value.length + ' / 17';
    });

    async function initWorker() {
      statusEl.textContent = 'جاري تجهيز محرك القراءة...';
      worker = Tesseract.createWorker();
      await worker.load();
      await worker.loadLanguage('eng');
      await worker.initialize('eng');
      await worker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',
        tessedit_pageseg_mode: '7'
      });
      statusEl.textContent = 'جاهز — وجّه المستطيل الأخضر على رقم الهيكل';
      startLoop();
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        await initWorker();
      } catch (err) {
        statusEl.textContent = 'الكاميرا المباشرة غير متاحة — استخدم التقاط الصورة بالأسفل';
        liveBtn.disabled = true;
      }
    }

    function startLoop() {
      if (scanTimer) clearInterval(scanTimer);
      scanTimer = setInterval(captureAndReadFrame, 850);
    }

    function toggleLiveScan() {
      isScanning = !isScanning;
      if (isScanning) {
        liveBtn.textContent = 'إيقاف المسح التلقائي';
        liveBtn.classList.remove('active');
        confirmBadge.textContent = 'حالة القراءة: جاري البحث';
        statusEl.textContent = 'المسح التلقائي يعمل...';
      } else {
        liveBtn.textContent = 'تشغيل المسح التلقائي';
        liveBtn.classList.add('active');
        confirmBadge.textContent = 'حالة القراءة: متوقف';
        statusEl.textContent = 'تم إيقاف المسح مؤقتاً — راجع الرقم أو عدّله ثم أرسله';
      }
    }

    // استخراج أفضل 17 خانة مطابقة لنمط رقم الهيكل القياسي
    function extractVinCandidate(rawText) {
      let cleaned = rawText.toUpperCase().replace(/[^A-Z0-9]/g, '');
      cleaned = cleaned.replace(/I/g, '1').replace(/O/g, '0').replace(/Q/g, '0');
      const strictMatch = cleaned.match(/[A-HJ-NPR-Z0-9]{17}/);
      if (strictMatch) return strictMatch[0];

      const alphaNum = rawText.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '');
      return alphaNum.slice(0, 17);
    }

    // تجهيز نسختين للمعالجة: تباين محسن للحروف الداكنة/المتربة وعكس ألوان للحروف الفاتحة على أرضية داكنة
    function buildProcessedCanvases(sourceEl, sx, sy, sw, sh, outW, outH) {
      const base = document.createElement('canvas');
      base.width = outW;
      base.height = outH;
      const bctx = base.getContext('2d');
      bctx.drawImage(sourceEl, sx, sy, sw, sh, 0, 0, outW, outH);

      const origData = bctx.getImageData(0, 0, outW, outH);

      const c1 = document.createElement('canvas');
      c1.width = outW;
      c1.height = outH;
      const ctx1 = c1.getContext('2d');
      const d1 = new Uint8ClampedArray(origData.data);
      for (let i = 0; i < d1.length; i += 4) {
        const gray = 0.299 * d1[i] + 0.587 * d1[i + 1] + 0.114 * d1[i + 2];
        const stretched = Math.max(0, Math.min(255, (gray - 128) * 1.7 + 128));
        d1[i] = stretched;
        d1[i + 1] = stretched;
        d1[i + 2] = stretched;
      }
      ctx1.putImageData(new ImageData(d1, outW, outH), 0, 0);

      const c2 = document.createElement('canvas');
      c2.width = outW;
      c2.height = outH;
      const ctx2 = c2.getContext('2d');
      const d2 = new Uint8ClampedArray(origData.data);
      for (let i = 0; i < d2.length; i += 4) {
        const gray = 0.299 * d2[i] + 0.587 * d2[i + 1] + 0.114 * d2[i + 2];
        const inv = 255 - gray;
        const stretchedInv = Math.max(0, Math.min(255, (inv - 128) * 1.75 + 128));
        d2[i] = stretchedInv;
        d2[i + 1] = stretchedInv;
        d2[i + 2] = stretchedInv;
      }
      ctx2.putImageData(new ImageData(d2, outW, outH), 0, 0);

      return [c1, c2];
    }

    async function captureAndReadFrame() {
      if (!isScanning || isBusy || !worker || !video.videoWidth) return;
      isBusy = true;

      try {
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        const cropW = Math.floor(vw * 0.90);
        const cropH = Math.floor(vh * 0.22);
        const cropX = Math.floor((vw - cropW) / 2);
        const cropY = Math.floor((vh - cropH) / 2);

        const [c1, c2] = buildProcessedCanvases(
          video,
          cropX,
          cropY,
          cropW,
          cropH,
          Math.min(1280, cropW),
          Math.min(280, cropH)
        );

        const res1 = await worker.recognize(c1);
        let candidate = extractVinCandidate(res1.data.text);

        if (!candidate || candidate.length < 17) {
          const res2 = await worker.recognize(c2);
          const alt = extractVinCandidate(res2.data.text);
          if (alt.length > candidate.length) candidate = alt;
        }

        if (candidate && candidate.length >= 10) {
          // كتابة القراءة فوراً في خانة رقم الهيكل لتظهر للمستخدم وتُعدّل بسهولة
          vinInput.value = candidate;
          charCount.textContent = 'الخانات: ' + candidate.length + ' / 17';

          if (candidate.length === 17) {
            confirmBadge.textContent = 'حالة القراءة: مكتمل (17/17)';
            statusEl.textContent = 'تم التقاط 17 خانة — راجع الرقم في الخانة واضغط إرسال';
            if (navigator.vibrate) navigator.vibrate(120);
            isScanning = false;
            liveBtn.textContent = 'مسح سيارة جديدة';
            liveBtn.classList.add('active');
          } else {
            confirmBadge.textContent = 'حالة القراءة: قراءة مباشرة';
            statusEl.textContent = 'تحديث مباشر في الخانة (' + candidate.length + '/17) — قرّب أو ثبّت الرقم';
          }
        }
      } catch (e) {
      } finally {
        isBusy = false;
      }
    }

    cameraInput.addEventListener('change', async function () {
      const file = this.files && this.files[0];
      if (!file) return;
      statusEl.textContent = 'جاري معالجة الصورة بدقة عالية...';

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = async function () {
          const targetW = 1400;
          const scale = img.width > targetW ? targetW / img.width : 1;
          const outW = Math.round(img.width * scale);
          const outH = Math.round(img.height * scale);

          const [c1, c2] = buildProcessedCanvases(img, 0, 0, img.width, img.height, outW, outH);
          const r1 = worker ? await worker.recognize(c1) : await Tesseract.recognize(c1, 'eng');
          let val = extractVinCandidate(r1.data.text);

          if (!val || val.length < 17) {
            const r2 = worker ? await worker.recognize(c2) : await Tesseract.recognize(c2, 'eng');
            const alt = extractVinCandidate(r2.data.text);
            if (alt.length > val.length) val = alt;
          }

          vinInput.value = val;
          charCount.textContent = 'الخانات: ' + val.length + ' / 17';
          confirmBadge.textContent = val.length === 17 ? 'حالة القراءة: مكتمل (17/17)' : 'حالة القراءة: راجع الرقم';
          statusEl.textContent = 'راجع الرقم في الخانة وتأكد منه ثم اضغط إرسال للشيت';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function sendToSheet() {
      const vin = vinInput.value.trim().toUpperCase();
      const ref = refInput.value.trim();

      if (!vin) {
        statusEl.textContent = 'وجّه الكاميرا على الرقم أو اكتبه أولاً';
        return;
      }

      sendBtn.disabled = true;
      statusEl.textContent = 'جاري الحفظ...';

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vin: vin, ref: ref })
      })
      .then(function () {
        statusEl.textContent = 'تم الحفظ: ' + vin + ' — جاهز للسيارة التالية';
        vinInput.value = '';
        charCount.textContent = 'الخانات: 0 / 17';
        confirmBadge.textContent = 'حالة القراءة: جاري البحث';
        sendBtn.disabled = false;
        isScanning = true;
        liveBtn.textContent = 'إيقاف المسح التلقائي';
        liveBtn.classList.remove('active');
      })
      .catch(function () {
        statusEl.textContent = 'فشل الإرسال — تأكد من الإنترنت';
        sendBtn.disabled = false;
      });
    }

    startCamera();
  </script>
</body>
</html>
