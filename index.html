<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماسح VIN الاحترافي السريع</title>
  <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #eef1f4;
      color: #1f2933;
      margin: 0;
      padding: 12px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #243b53;
    }
    .scanner-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      background: #102a43;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* إطار تصويب مخصص لسطر رقم الهيكل فقط */
    .aim-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: rgba(16, 42, 67, 0.35);
    }
    .aim-box {
      width: 88%;
      height: 54px;
      border: 2px solid #48bb78;
      border-radius: 6px;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(16, 42, 67, 0.45);
    }
    .aim-label {
      color: #ffffff;
      font-size: 12px;
      margin-top: 8px;
      background: rgba(0, 0, 0, 0.55);
      padding: 3px 8px;
      border-radius: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid #bcccdc;
      background: #f8fafc;
      color: #102a43;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #ffffff;
    }
    .btn-live { background-color: #2f855a; }
    .btn-live.active { background-color: #c53030; }
    .btn-send { background-color: #2b6cb0; }
    .btn-fallback {
      width: 100%;
      background-color: #486581;
      font-size: 13px;
      padding: 10px;
      display: block;
      border-radius: 8px;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #334e68;
      min-height: 20px;
      word-break: break-word;
    }
    .visually-hidden-file {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>ماسح VIN السريع (إطار مباشر)</h2>

    <div class="scanner-wrap" id="scannerWrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="aim-overlay">
        <div class="aim-box" id="aimBox"></div>
        <div class="aim-label">ضع رقم الهيكل (17 خانة) داخل المستطيل الأخضر</div>
      </div>
    </div>

    <input type="text" id="vinInput" placeholder="رقم الهيكل (17 خانة)" maxlength="25">
    <input type="text" id="refInput" placeholder="الرقم المرجعي (اختياري)">

    <div class="btn-row">
      <button type="button" class="btn btn-live" id="liveBtn" onclick="toggleLiveScan()">إيقاف المسح التلقائي</button>
      <button type="button" class="btn btn-send" id="sendBtn" onclick="sendToSheet()">إرسال للشيت</button>
    </div>

    <label for="cameraInput" class="btn-fallback">التقاط صورة سريعة (بديل)</label>
    <input type="file" id="cameraInput" class="visually-hidden-file" accept="image/*" capture="environment">

    <div id="status">جاري تشغيل الكاميرا...</div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzWHfARbW5XAfA82jDQgc_QK_F6ZhN1rtYuh0AVP46rKXA6cGtVT5on7YCP9Of6YMBftw/exec';
    const video = document.getElementById('video');
    const vinInput = document.getElementById('vinInput');
    const refInput = document.getElementById('refInput');
    const statusEl = document.getElementById('status');
    const liveBtn = document.getElementById('liveBtn');
    const sendBtn = document.getElementById('sendBtn');
    const cameraInput = document.getElementById('cameraInput');

    let worker = null;
    let isScanning = true;
    let isBusy = false;
    let scanTimer = null;

    // تهيئة محرك القراءة مرة واحدة فقط لتسريع المسح المتكرر
    async function initWorker() {
      statusEl.textContent = 'جاري تجهيز محرك القراءة السريع...';
      worker = Tesseract.createWorker();
      await worker.load();
      await worker.loadLanguage('eng');
      await worker.initialize('eng');
      await worker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',
        tessedit_pageseg_mode: '7' // سطر نصي واحد فقط
      });
      statusEl.textContent = 'جاهز — وجّه المستطيل الأخضر على رقم الهيكل';
      startLoop();
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await initWorker();
      } catch (err) {
        statusEl.textContent = 'الكاميرا المباشرة محجوبة — استخدم زر "التقاط صورة سريعة" بالأسفل';
        liveBtn.disabled = true;
      }
    }

    function startLoop() {
      if (scanTimer) clearInterval(scanTimer);
      scanTimer = setInterval(captureAndReadFrame, 900);
    }

    function toggleLiveScan() {
      isScanning = !isScanning;
      if (isScanning) {
        liveBtn.textContent = 'إيقاف المسح التلقائي';
        liveBtn.classList.remove('active');
        statusEl.textContent = 'المسح التلقائي يعمل...';
      } else {
        liveBtn.textContent = 'تشغيل المسح التلقائي';
        liveBtn.classList.add('active');
        statusEl.textContent = 'تم إيقاف المسح مؤقتاً';
      }
    }

    function extractValidVin(rawText) {
      const cleaned = rawText.replace(/[^A-HJ-NPR-Z0-9]/gi, '').toUpperCase();
      // البحث عن سلسلة من 17 خانة قياسية (تبدأ بحرف أو رقم وتنتهي بأرقام غالباً)
      const match = cleaned.match(/[A-HJ-NPR-Z0-9]{17}/);
      return match ? match[0] : '';
    }

    async function captureAndReadFrame() {
      if (!isScanning || isBusy || !worker || !video.videoWidth) return;
      isBusy = true;

      try {
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        // قص منطقة المستطيل الأخضر في المنتصف فقط (88% عرض × 24% ارتفاع)
        const cropW = Math.floor(vw * 0.88);
        const cropH = Math.floor(vh * 0.24);
        const cropX = Math.floor((vw - cropW) / 2);
        const cropY = Math.floor((vh - cropH) / 2);

        const canvas = document.createElement('canvas');
        canvas.width = cropW;
        canvas.height = cropH;
        const ctx = canvas.getContext('2d');

        // تحسين التباين (أبيض وأسود عالي الوضوح) لزيادة دقة القراءة
        ctx.filter = 'grayscale(100%) contrast(160%)';
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        const { data: { text } } = await worker.recognize(canvas);
        const vin = extractValidVin(text);

        if (vin && vin.length === 17) {
          vinInput.value = vin;
          statusEl.textContent = 'تم التقاط رقم الهيكل (17 خانة) — اضغط إرسال للشيت';
          if (navigator.vibrate) navigator.vibrate(120);
          // إيقاف المسح مؤقتاً عند النجاح حتى لا يكتب فوق الرقم
          isScanning = false;
          liveBtn.textContent = 'مسح سيارة جديدة';
          liveBtn.classList.add('active');
        }
      } catch (e) {
        // تجاهل أخطاء الإطار الفردي والاستمرار
      } finally {
        isBusy = false;
      }
    }

    // البديل السريع عبر التقاط صورة إذا لم تعمل الكاميرا الحية
    cameraInput.addEventListener('change', async function () {
      const file = this.files && this.files[0];
      if (!file) return;
      statusEl.textContent = 'جاري استخراج الرقم من الصورة...';

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = async function () {
          const maxW = 900;
          const scale = img.width > maxW ? maxW / img.width : 1;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.filter = 'grayscale(100%) contrast(150%)';
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const res = worker
            ? await worker.recognize(canvas)
            : await Tesseract.recognize(canvas, 'eng');
          const vin = extractValidVin(res.data.text);
          vinInput.value = vin || res.data.text.replace(/[^A-HJ-NPR-Z0-9]/gi, '').toUpperCase().slice(0, 17);
          statusEl.textContent = 'راجع الرقم واضغط إرسال للشيت';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function sendToSheet() {
      const vin = vinInput.value.trim().toUpperCase();
      const ref = refInput.value.trim();

      if (!vin) {
        statusEl.textContent = 'وجّه الكاميرا على الرقم أو اكتبه أولاً';
        return;
      }

      sendBtn.disabled = true;
      statusEl.textContent = 'جاري الحفظ...';

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vin: vin, ref: ref })
      })
      .then(function () {
        statusEl.textContent = 'تم الحفظ: ' + vin + ' — جاهز للسيارة التالية';
        vinInput.value = '';
        sendBtn.disabled = false;
        // إعادة تشغيل المسح التلقائي فوراً للسيارة التالية
        isScanning = true;
        liveBtn.textContent = 'إيقاف المسح التلقائي';
        liveBtn.classList.remove('active');
      })
      .catch(function () {
        statusEl.textContent = 'فشل الإرسال — تأكد من الإنترنت';
        sendBtn.disabled = false;
      });
    }

    startCamera();
  </script>
</body>
</html>
