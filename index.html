<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماسح VIN السريع</title>
  <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #eef1f4;
      color: #1f2933;
      margin: 0;
      padding: 12px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #243b53;
    }
    .scanner-wrap {
      position: relative;
      width: 100%;
      height: 235px;
      background: #102a43;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .aim-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .aim-box {
      width: 92%;
      height: 60px;
      border: 2px solid #2f855a;
      border-radius: 6px;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(16, 42, 67, 0.52);
    }
    .aim-label {
      color: #ffffff;
      font-size: 12px;
      margin-top: 8px;
      background: rgba(16, 42, 67, 0.85);
      padding: 4px 10px;
      border-radius: 5px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #486581;
      margin-bottom: 6px;
      padding: 0 2px;
    }
    input[type="text"] {
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid #bcccdc;
      background: #f8fafc;
      color: #102a43;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #ffffff;
    }
    .btn-live { background-color: #2f855a; }
    .btn-live.active { background-color: #c53030; }
    .btn-send { background-color: #2b6cb0; }
    .btn-fallback {
      width: 100%;
      background-color: #486581;
      font-size: 13px;
      padding: 10px;
      display: block;
      border-radius: 8px;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #334e68;
      min-height: 20px;
      word-break: break-word;
    }
    .visually-hidden-file {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>ماسح VIN السريع</h2>

    <div class="scanner-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="aim-overlay">
        <div class="aim-box"></div>
        <div class="aim-label">مرّر الرقم (17 خانة) داخل المستطيل الأخضر</div>
      </div>
    </div>

    <div class="meta-row">
      <span id="charCount">الخانات: 0 / 17</span>
      <span id="confirmBadge">الوضع: مسح فوري</span>
    </div>

    <input type="text" id="vinInput" placeholder="رقم الهيكل (17 خانة)" maxlength="17">
    <input type="text" id="refInput" placeholder="الرقم المرجعي (اختياري)">

    <div class="btn-row">
      <button type="button" class="btn btn-live" id="liveBtn" onclick="toggleLiveScan()">إيقاف المسح التلقائي</button>
      <button type="button" class="btn btn-send" id="sendBtn" onclick="sendToSheet()">إرسال للشيت</button>
    </div>

    <label for="cameraInput" class="btn-fallback">التقاط صورة عالية الدقة (بديل)</label>
    <input type="file" id="cameraInput" class="visually-hidden-file" accept="image/*" capture="environment">

    <div id="status">جاري تشغيل الكاميرا...</div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzWHfARbW5XAfA82jDQgc_QK_F6ZhN1rtYuh0AVP46rKXA6cGtVT5on7YCP9Of6YMBftw/exec';
    const video = document.getElementById('video');
    const vinInput = document.getElementById('vinInput');
    const refInput = document.getElementById('refInput');
    const statusEl = document.getElementById('status');
    const liveBtn = document.getElementById('liveBtn');
    const sendBtn = document.getElementById('sendBtn');
    const cameraInput = document.getElementById('cameraInput');
    const charCount = document.getElementById('charCount');
    const confirmBadge = document.getElementById('confirmBadge');

    let worker = null;
    let isScanning = true;
    let isBusy = false;
    let scanTimer = null;

    // تصويت تراكمي على 17 خانة دون إعادة تصفير عند اهتزاز اليد الخفيف
    let readingHistory = [];

    vinInput.addEventListener('input', function () {
      this.value = this.value.replace(/[^A-HJ-NPR-Z0-9]/gi, '').toUpperCase().slice(0, 17);
      charCount.textContent = 'الخانات: ' + this.value.length + ' / 17';
    });

    async function initWorker() {
      statusEl.textContent = 'جاري تجهيز محرك القراءة السريع...';
      worker = Tesseract.createWorker();
      await worker.load();
      await worker.loadLanguage('eng');
      await worker.initialize('eng');
      await worker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',
        tessedit_pageseg_mode: '7'
      });
      statusEl.textContent = 'جاهز — مرّر الرقم داخل المستطيل الأخضر';
      startLoop();
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            focusMode: { ideal: 'continuous' }
          },
          audio: false
        });
        video.srcObject = stream;
        const track = stream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          try {
            await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          } catch (_) {}
        }
        await initWorker();
      } catch (err) {
        statusEl.textContent = 'الكاميرا المباشرة غير متاحة — استخدم التقاط الصورة بالأسفل';
        liveBtn.disabled = true;
      }
    }

    function startLoop() {
      if (scanTimer) clearInterval(scanTimer);
      scanTimer = setInterval(captureAndReadFrame, 450);
    }

    function toggleLiveScan() {
      isScanning = !isScanning;
      if (isScanning) {
        readingHistory = [];
        liveBtn.textContent = 'إيقاف المسح التلقائي';
        liveBtn.classList.remove('active');
        confirmBadge.textContent = 'الوضع: مسح فوري';
        statusEl.textContent = 'المسح التلقائي يعمل...';
      } else {
        liveBtn.textContent = 'تشغيل المسح التلقائي';
        liveBtn.classList.add('active');
        confirmBadge.textContent = 'الوضع: متوقف';
        statusEl.textContent = 'تم إيقاف المسح — راجع الرقم في الخانة أو عدّله ثم أرسله';
      }
    }

    // استخراج أقوى 17 خانة لرقم الهيكل من النص المقروء
    function extractBestVin(rawText) {
      let cleaned = rawText.toUpperCase().replace(/[^A-Z0-9]/g, '');
      cleaned = cleaned.replace(/I/g, '1').replace(/O/g, '0').replace(/Q/g, '0');
      const strictMatch = cleaned.match(/[A-HJ-NPR-Z0-9]{17}/);
      if (strictMatch) return strictMatch[0];

      const fallback = rawText.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '');
      return fallback.slice(0, 17);
    }

    // دمج القراءات المتتالية باختيار الحرف/الرقم الأكثر تكراراً في كل خانة (لتجاوز اهتزاز اليد)
    function aggregateVin(historyList) {
      if (!historyList.length) return '';
      const result = [];
      for (let i = 0; i < 17; i++) {
        const freq = {};
        let bestChar = '';
        let bestCount = 0;

        for (let h = 0; h < historyList.length; h++) {
          const ch = historyList[h][i];
          if (!ch) continue;
          freq[ch] = (freq[ch] || 0) + 1;
          if (freq[ch] > bestCount) {
            bestCount = freq[ch];
            bestChar = ch;
          }
        }
        if (bestChar) result.push(bestChar);
      }
      return result.join('');
    }

    // معالجة الإطار بدون قطع حاد للحروف لكي لا تتحول الأرقام/الحروف إلى تكرارات خاطئة
    function prepareCleanFrame(sourceEl, sx, sy, sw, sh, outW, outH) {
      const canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(sourceEl, sx, sy, sw, sh, 0, 0, outW, outH);

      const imgData = ctx.getImageData(0, 0, outW, outH);
      const data = imgData.data;

      let sumLum = 0;
      for (let i = 0; i < data.length; i += 4) {
        sumLum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      }
      const avgLum = sumLum / (data.length / 4);
      const invertDarkBg = avgLum < 118;

      for (let i = 0; i < data.length; i += 4) {
        let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        if (invertDarkBg) gray = 255 - gray;
        // رفع تباين معتدل يحافظ على حواف الأرقام والحروف بدقة
        const val = Math.max(0, Math.min(255, (gray - 128) * 1.45 + 128));
        data[i] = val;
        data[i + 1] = val;
        data[i + 2] = val;
      }

      ctx.putImageData(new ImageData(data, outW, outH), 0, 0);
      return canvas;
    }

    async function captureAndReadFrame() {
      if (!isScanning || isBusy || !worker || !video.videoWidth) return;
      isBusy = true;

      try {
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        const cropW = Math.floor(vw * 0.92);
        const cropH = Math.floor(vh * 0.22);
        const cropX = Math.floor((vw - cropW) / 2);
        const cropY = Math.floor((vh - cropH) / 2);

        const canvas = prepareCleanFrame(
          video,
          cropX,
          cropY,
          cropW,
          cropH,
          Math.min(1200, cropW),
          Math.min(250, cropH)
        );

        const { data: { text } } = await worker.recognize(canvas);
        const vin = extractBestVin(text);

        if (vin && vin.length >= 12) {
          readingHistory.push(vin);
          if (readingHistory.length > 5) readingHistory.shift();

          const aggregated = aggregateVin(readingHistory);
          const finalVin = aggregated.length === 17 ? aggregated : vin;

          // كتابة النتيجة فوراً داخل خانة رقم الهيكل
          vinInput.value = finalVin;
          charCount.textContent = 'الخانات: ' + finalVin.length + ' / 17';

          if (finalVin.length === 17 && readingHistory.length >= 2) {
            confirmBadge.textContent = 'الوضع: مكتمل (17/17)';
            statusEl.textContent = 'تم التقاط الرقم — راجع أو عدّل ثم اضغط إرسال للشيت';
            if (navigator.vibrate) navigator.vibrate(100);
            isScanning = false;
            liveBtn.textContent = 'مسح سيارة جديدة';
            liveBtn.classList.add('active');
          } else {
            confirmBadge.textContent = 'الوضع: تحديث حي';
            statusEl.textContent = 'قراءة مباشرة في الخانة (' + finalVin.length + '/17) — مرّر أو ثبّت لحظة';
          }
        }
      } catch (e) {
      } finally {
        isBusy = false;
      }
    }

    cameraInput.addEventListener('change', async function () {
      const file = this.files && this.files[0];
      if (!file) return;
      statusEl.textContent = 'جاري معالجة الصورة...';

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = async function () {
          const targetW = 1300;
          const scale = img.width > targetW ? targetW / img.width : 1;
          const outW = Math.round(img.width * scale);
          const outH = Math.round(img.height * scale);

          const canvas = prepareCleanFrame(img, 0, 0, img.width, img.height, outW, outH);
          const res = worker
            ? await worker.recognize(canvas)
            : await Tesseract.recognize(canvas, 'eng');

          const vin = extractBestVin(res.data.text);
          vinInput.value = vin;
          charCount.textContent = 'الخانات: ' + vin.length + ' / 17';
          confirmBadge.textContent = vin.length === 17 ? 'الوضع: مكتمل (17/17)' : 'الوضع: راجع الرقم';
          statusEl.textContent = 'راجع الرقم في الخانة وتأكد منه ثم اضغط إرسال للشيت';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function sendToSheet() {
      const vin = vinInput.value.trim().toUpperCase();
      const ref = refInput.value.trim();

      if (!vin) {
        statusEl.textContent = 'مرّر الكاميرا على الرقم أو اكتبه أولاً';
        return;
      }

      sendBtn.disabled = true;
      statusEl.textContent = 'جاري الحفظ...';

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vin: vin, ref: ref })
      })
      .then(function () {
        statusEl.textContent = 'تم الحفظ: ' + vin + ' — جاهز للسيارة التالية';
        vinInput.value = '';
        charCount.textContent = 'الخانات: 0 / 17';
        readingHistory = [];
        confirmBadge.textContent = 'الوضع: مسح فوري';
        sendBtn.disabled = false;
        isScanning = true;
        liveBtn.textContent = 'إيقاف المسح التلقائي';
        liveBtn.classList.remove('active');
      })
      .catch(function () {
        statusEl.textContent = 'فشل الإرسال — تأكد من الإنترنت';
        sendBtn.disabled = false;
      });
    }

    startCamera();
  </script>
</body>
</html>
