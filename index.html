<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماسح VIN الذكي للجرد</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #eef1f4;
      color: #1f2933;
      margin: 0;
      padding: 12px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #243b53;
    }
    .api-box {
      background: #f8fafc;
      border: 1px solid #bcccdc;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .api-box input {
      flex: 1;
      margin: 0;
      padding: 8px;
      font-size: 12px;
      text-align: left;
      direction: ltr;
    }
    .api-box button {
      padding: 8px 12px;
      background: #2f855a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    .scanner-wrap {
      position: relative;
      width: 100%;
      height: 235px;
      background: #102a43;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .aim-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .aim-box {
      width: 92%;
      height: 58px;
      border: 2px solid #2f855a;
      border-radius: 6px;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(16, 42, 67, 0.52);
    }
    .aim-label {
      color: #ffffff;
      font-size: 12px;
      margin-top: 8px;
      background: rgba(16, 42, 67, 0.85);
      padding: 4px 10px;
      border-radius: 5px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #486581;
      margin-bottom: 6px;
      padding: 0 2px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid #bcccdc;
      background: #f8fafc;
      color: #102a43;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    input[type="password"] {
      text-transform: none;
      letter-spacing: 0;
      font-weight: normal;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #ffffff;
    }
    .btn-live { background-color: #2f855a; }
    .btn-live.active { background-color: #c53030; }
    .btn-send { background-color: #2b6cb0; }
    .btn-fallback {
      width: 100%;
      background-color: #486581;
      font-size: 13px;
      padding: 10px;
      display: block;
      border-radius: 8px;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #334e68;
      min-height: 20px;
      word-break: break-word;
    }
    .visually-hidden-file {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>ماسح VIN الذكي للجرد</h2>

    <div class="api-box" id="apiBox">
      <input type="password" id="apiKeyInput" placeholder="ألصق مفتاح Gemini API Key هنا مرة واحدة">
      <button type="button" onclick="saveApiKey()">حفظ</button>
    </div>

    <div class="scanner-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="aim-overlay">
        <div class="aim-box"></div>
        <div class="aim-label">وجّه الرقم داخل المستطيل أو اضغط التقاط صورة عالية الدقة</div>
      </div>
    </div>

    <div class="meta-row">
      <span id="charCount">الخانات: 0 / 17</span>
      <span id="modeBadge">الوضع: جاهز</span>
    </div>

    <input type="text" id="vinInput" placeholder="رقم الهيكل (17 خانة)" maxlength="17">
    <input type="text" id="refInput" placeholder="الرقم المرجعي (اختياري)">

    <div class="btn-row">
      <button type="button" class="btn btn-live" id="liveBtn" onclick="toggleLiveScan()">تشغيل المسح التلقائي</button>
      <button type="button" class="btn btn-send" id="sendBtn" onclick="sendToSheet()">إرسال للشيت</button>
    </div>

    <label for="cameraInput" class="btn-fallback">التقاط صورة عالية الدقة (موصى به)</label>
    <input type="file" id="cameraInput" class="visually-hidden-file" accept="image/*" capture="environment">

    <div id="status">جاري تشغيل الكاميرا...</div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzWHfARbW5XAfA82jDQgc_QK_F6ZhN1rtYuh0AVP46rKXA6cGtVT5on7YCP9Of6YMBftw/exec';
    const video = document.getElementById('video');
    const vinInput = document.getElementById('vinInput');
    const refInput = document.getElementById('refInput');
    const statusEl = document.getElementById('status');
    const liveBtn = document.getElementById('liveBtn');
    const sendBtn = document.getElementById('sendBtn');
    const cameraInput = document.getElementById('cameraInput');
    const charCount = document.getElementById('charCount');
    const modeBadge = document.getElementById('modeBadge');
    const apiKeyInput = document.getElementById('apiKeyInput');

    // المسح التلقائي متوقف افتراضياً لتوفير الحصة وتجنب الأخطاء المتكررة؛ يعمل عند الضغط أو بالتقاط الصورة
    let isScanning = false;
    let isBusy = false;
    let scanTimer = null;

    const savedKey = localStorage.getItem('GEMINI_VIN_API_KEY') || '';
    if (savedKey) {
      apiKeyInput.value = savedKey;
    }

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        statusEl.textContent = 'أدخل مفتاح Gemini API Key أولاً';
        return;
      }
      localStorage.setItem('GEMINI_VIN_API_KEY', key);
      statusEl.textContent = 'تم حفظ المفتاح — استخدم التقاط صورة عالية الدقة أو شغل المسح التلقائي';
    }

    vinInput.addEventListener('input', function () {
      this.value = this.value.replace(/[^A-HJ-NPR-Z0-9]/gi, '').toUpperCase().slice(0, 17);
      charCount.textContent = 'الخانات: ' + this.value.length + ' / 17';
    });

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            focusMode: { ideal: 'continuous' }
          },
          audio: false
        });
        video.srcObject = stream;
        const track = stream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          try {
            await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          } catch (_) {}
        }
        statusEl.textContent = savedKey
          ? 'جاهز — اضغط (التقاط صورة عالية الدقة) لقراءة فورية بدون استهلاك الحصة'
          : 'ألصق مفتاح Gemini API Key بالأعلى واضغط حفظ للبدء';
      } catch (err) {
        statusEl.textContent = 'الكاميرا المباشرة غير متاحة — استخدم التقاط الصورة بالأسفل';
        liveBtn.disabled = true;
      }
    }

    function startLoop() {
      if (scanTimer) clearInterval(scanTimer);
      scanTimer = setInterval(captureAndReadWithGemini, 4000);
    }

    function stopLoop() {
      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
      }
    }

    function toggleLiveScan() {
      isScanning = !isScanning;
      if (isScanning) {
        liveBtn.textContent = 'إيقاف المسح التلقائي';
        liveBtn.classList.add('active');
        modeBadge.textContent = 'الوضع: مسح تلقائي';
        statusEl.textContent = 'المسح التلقائي يعمل كل 4 ثوانٍ...';
        startLoop();
      } else {
        stopLoop();
        liveBtn.textContent = 'تشغيل المسح التلقائي';
        liveBtn.classList.remove('active');
        modeBadge.textContent = 'الوضع: متوقف';
        statusEl.textContent = 'تم إيقاف المسح التلقائي لتوفير الحصة';
      }
    }

    function sanitizeVin(raw) {
      if (!raw) return '';
      let s = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
      s = s.replace(/I/g, '1').replace(/O/g, '0').replace(/Q/g, '0');
      const m = s.match(/[A-HJ-NPR-Z0-9]{17}/);
      return m ? m[0] : '';
    }

    async function askGeminiVision(base64Jpeg) {
      const apiKey = (localStorage.getItem('GEMINI_VIN_API_KEY') || apiKeyInput.value).trim();
      if (!apiKey) return '';

      const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(apiKey);
      const body = {
        contents: [{
          parts: [
            {
              text: 'Read the 17-character Vehicle Identification Number (VIN) shown inside this image. Output ONLY the exact 17 alphanumeric characters in uppercase with no spaces or explanation. If no clear 17-character VIN is visible, output NONE.'
            },
            {
              inline_data: {
                mime_type: 'image/jpeg',
                data: base64Jpeg
              }
            }
          ]
        }],
        generationConfig: {
          temperature: 0,
          maxOutputTokens: 32
        }
      };

      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!resp.ok) {
        const errData = await resp.json().catch(() => ({}));
        throw new Error((errData.error && errData.error.message) || 'API Error');
      }

      const data = await resp.json();
      const txt = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts
        ? data.candidates[0].content.parts.map(p => p.text || '').join('')
        : '';

      if (txt.trim().toUpperCase().includes('NONE')) return '';
      return sanitizeVin(txt);
    }

    async function captureAndReadWithGemini() {
      const apiKey = (localStorage.getItem('GEMINI_VIN_API_KEY') || apiKeyInput.value).trim();
      if (!apiKey || !isScanning || isBusy || !video.videoWidth) return;
      isBusy = true;

      try {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const cropW = Math.floor(vw * 0.94);
        const cropH = Math.floor(vh * 0.28);
        const cropX = Math.floor((vw - cropW) / 2);
        const cropY = Math.floor((vh - cropH) / 2);

        const canvas = document.createElement('canvas');
        canvas.width = Math.min(1280, cropW);
        canvas.height = Math.min(360, cropH);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

        const base64 = canvas.toDataURL('image/jpeg', 0.88).split(',')[1];
        statusEl.textContent = 'جاري القراءة بالذكاء الاصطناعي...';

        const vin = await askGeminiVision(base64);
        if (vin && vin.length === 17) {
          vinInput.value = vin;
          charCount.textContent = 'الخانات: 17 / 17';
          isScanning = false;
          stopLoop();
          liveBtn.textContent = 'تشغيل المسح التلقائي';
          liveBtn.classList.remove('active');
          modeBadge.textContent = 'مكتمل (17/17)';
          statusEl.textContent = 'تم التقاط الرقم بدقة — اضغط إرسال للشيت';
          if (navigator.vibrate) navigator.vibrate(100);
        } else {
          statusEl.textContent = 'لم يظهر رقم واضح — جرّب التقاط صورة عالية الدقة';
        }
      } catch (err) {
        // إيقاف المسح التلقائي فوراً عند نفاد الحصة حتى لا تتكرر الرسالة كل ثانية
        isScanning = false;
        stopLoop();
        liveBtn.textContent = 'تشغيل المسح التلقائي';
        liveBtn.classList.remove('active');
        modeBadge.textContent = 'تجاوز الحد (Quota)';
        if (err.message && err.message.toLowerCase().includes('quota')) {
          statusEl.textContent = 'تم تجاوز حد الاستخدام المجاني لمفتاح Gemini حالياً — انتظر قليلاً أو استخدم مفتاحاً آخر من Google AI Studio';
        } else {
          statusEl.textContent = 'خطأ في الاتصال أو المفتاح: ' + err.message;
        }
      } finally {
        isBusy = false;
      }
    }

    cameraInput.addEventListener('change', async function () {
      const file = this.files && this.files[0];
      if (!file) return;
      const apiKey = (localStorage.getItem('GEMINI_VIN_API_KEY') || apiKeyInput.value).trim();
      if (!apiKey) {
        statusEl.textContent = 'ألصق مفتاح Gemini API Key بالأعلى أولاً';
        return;
      }

      statusEl.textContent = 'جاري تحليل الصورة عالية الدقة...';
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = async function () {
          const maxW = 1400;
          const scale = img.width > maxW ? maxW / img.width : 1;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const base64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
          try {
            const vin = await askGeminiVision(base64);
            if (vin) {
              vinInput.value = vin;
              charCount.textContent = 'الخانات: 17 / 17';
              modeBadge.textContent = 'صورة عالية الدقة';
              statusEl.textContent = 'تمت القراءة بدقة — اضغط إرسال للشيت';
            } else {
              statusEl.textContent = 'لم يتم العثور على 17 خانة واضحة في الصورة';
            }
          } catch (err) {
            modeBadge.textContent = 'تجاوز الحد (Quota)';
            if (err.message && err.message.toLowerCase().includes('quota')) {
              statusEl.textContent = 'تم تجاوز حد الاستخدام المجاني لمفتاح Gemini حالياً — انتظر قليلاً أو استخدم مفتاحاً آخر من Google AI Studio';
            } else {
              statusEl.textContent = 'خطأ: ' + err.message;
            }
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function sendToSheet() {
      const vin = vinInput.value.trim().toUpperCase();
      const ref = refInput.value.trim();

      if (!vin) {
        statusEl.textContent = 'التقط الرقم أو اكتبه أولاً';
        return;
      }

      sendBtn.disabled = true;
      statusEl.textContent = 'جاري الحفظ...';

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vin: vin, ref: ref })
      })
      .then(function () {
        statusEl.textContent = 'تم الحفظ: ' + vin + ' — جاهز للسيارة التالية';
        vinInput.value = '';
        charCount.textContent = 'الخانات: 0 / 17';
        modeBadge.textContent = 'الوضع: جاهز';
        sendBtn.disabled = false;
      })
      .catch(function () {
        statusEl.textContent = 'فشل الإرسال — تأكد من الإنترنت';
        sendBtn.disabled = false;
      });
    }

    startCamera();
  </script>
</body>
</html>
